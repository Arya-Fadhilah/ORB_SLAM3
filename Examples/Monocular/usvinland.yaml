%YAML:1.0

# =============================================================================
# CATATAN PENTING — BACA SEBELUM PAKAI:
# Sama seperti versi stereo: tidak ada file kalibrasi resmi ditemukan.
# fx/fy/cx/cy adalah ESTIMASI dari spesifikasi FOV (Mynteye S2110-95: HFoV 95,
# VFoV 50), BUKAN hasil kalibrasi checkerboard aktual.
#
# PERBEDAAN PALING PENTING dari versi stereo: mode ini MONOCULAR TANPA IMU,
# artinya trajectory yang dihasilkan TIDAK PUNYA SKALA METRIK ABSOLUT.
# Bentuknya benar, tapi satuan jarak/posisinya arbitrer -- bukan meter asli.
# Jangan langsung pakai output mode ini untuk feed Nav2 costmap yang
# parameternya berbasis meter (min/max_obstacle_height, obstacle_range, dst)
# tanpa penyesuaian skala terlebih dahulu.
#
# Asumsi resolusi: 640x400 (terkonfirmasi dari cv2.imread().shape sebelumnya)
# Asumsi: gambar sudah RECTIFIED -> distortion coefficient nol
# =============================================================================

File.version: "1.0"

Camera.type: "PinHole"

# --- Intrinsik, estimasi dari FOV (identik dengan versi stereo, cam0/LEFT saja) ---
Camera1.fx: 241.9830
Camera1.fy: 241.9830
Camera1.cx: 342.6946
Camera1.cy: 208.7039
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.k3: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

Camera.width: 640
Camera.height: 400

Camera.fps: 20

Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# ORB Parameters (sama seperti versi stereo)
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures: 1500
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0